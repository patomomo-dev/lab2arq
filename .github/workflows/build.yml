name: CI/CD Pipeline
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  # 1. TRABAJO DE PRUEBAS (CON BASE DE DATOS INCLUIDA)
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    # ---> ESTO SOLUCIONA EL ERROR DE LAS PRUEBAS <---
    # Levanta un MySQL temporal idéntico al que pide la guía del Lab 1
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: banco
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Tests
        run: mvn -B test


  # 2. TRABAJO DE SONARCLOUD
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build project (skip tests to speed up)
        run: mvn -B clean verify -DskipTests

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=patomomo-dev_lab2arq3
          -Dsonar.organization=patomomo-dev
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN

  # 3. TRABAJO DE EMPAQUETADO Y DOCKER
  build:
    needs: sonar
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '17'

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          # Usamos un comodín para que tome el JAR del banco sin importar cómo se llame
          path: target/lab2arq.jar

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: santiagorendonr/lab2arq
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  # 4. TRABAJO DE DESPLIEGUE EN LA NUBE (Render)
  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        if: success() # Solo se dispara si las pruebas y la compilación del job 'build' pasaron con éxito
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}